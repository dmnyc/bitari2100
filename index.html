<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
        />

        <!-- PWA Meta Tags -->
        <meta name="application-name" content="Bitari 2100" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta
            name="apple-mobile-web-app-status-bar-style"
            content="black-translucent"
        />
        <meta name="apple-mobile-web-app-title" content="Bitari 2100" />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="theme-color" content="#000000" />
        <meta name="msapplication-TileColor" content="#000000" />
        <meta name="msapplication-tap-highlight" content="no" />

        <!-- Description -->
        <meta
            name="description"
            content="Bitari 2100 - A retro-themed Bitcoin Lightning wallet powered by Breez SDK"
        />

        <!-- Open Graph -->
        <meta property="og:title" content="Bitari 2100" />
        <meta
            property="og:description"
            content="A retro-themed Bitcoin Lightning wallet powered by Breez SDK"
        />
        <meta
            property="og:image"
            content="https://bitari2100.vercel.app/bitari_social.png"
        />
        <meta property="og:type" content="website" />

        <!-- Twitter Card -->
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="Bitari 2100" />
        <meta
            name="twitter:description"
            content="A retro-themed Bitcoin Lightning wallet powered by Breez SDK"
        />
        <meta
            name="twitter:image"
            content="https://bitari2100.vercel.app/bitari_social.png"
        />

        <!-- Icons -->
        <link rel="icon" href="/favicon.ico" sizes="any" />
        <link
            rel="icon"
            type="image/png"
            sizes="32x32"
            href="/favicon-32x32.png"
        />
        <link
            rel="icon"
            type="image/png"
            sizes="16x16"
            href="/favicon-16x16.png"
        />
        <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

        <!-- Manifest -->
        <link rel="manifest" href="/manifest.json" />

        <title>Bitari 2100</title>

        <!-- Fonts - Press Start 2P for authentic pixel text -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
            rel="stylesheet"
        />

        <!-- Atari boot sequence styles -->
        <style>
            html,
            body {
                overscroll-behavior-y: none;
                background: #000000;
            }

            #splash {
                position: fixed;
                inset: 0;
                background: #000000;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                z-index: 9999;
                opacity: 1;
                transition: opacity 0.2s ease-out;
                font-family: "Press Start 2P", monospace;
            }
            #splash.hidden {
                opacity: 0;
                pointer-events: none;
            }

            .boot-text {
                color: #ac5030;
                font-size: 10px;
                letter-spacing: 2px;
                animation: boot-blink 1s steps(2) infinite;
            }

            .boot-bar {
                margin-top: 16px;
                width: 160px;
                height: 8px;
                border: 2px solid #6c6c6c;
                position: relative;
                overflow: hidden;
            }

            .boot-bar::after {
                content: "";
                position: absolute;
                left: 0;
                top: 0;
                height: 100%;
                width: 0%;
                background: #ac5030;
                animation: boot-load 2s steps(8) forwards;
            }

            @keyframes boot-blink {
                0%,
                49% {
                    opacity: 1;
                }
                50%,
                100% {
                    opacity: 0;
                }
            }

            @keyframes boot-load {
                0% {
                    width: 0%;
                }
                100% {
                    width: 100%;
                }
            }
        </style>
    </head>

    <body>
        <!-- Atari boot splash screen -->
        <div id="splash">
            <div class="boot-text">LOADING CARTRIDGE</div>
            <div class="boot-bar"></div>
        </div>

        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>

        <!-- Service Worker Registration -->
        <script>
            if ("serviceWorker" in navigator) {
                window.addEventListener("load", () => {
                    navigator.serviceWorker
                        .register("/sw.js")
                        .then((registration) => {
                            console.log("SW registered:", registration.scope);
                        })
                        .catch((error) => {
                            console.log("SW registration failed:", error);
                        });
                });
            }
        </script>
    </body>
</html>
